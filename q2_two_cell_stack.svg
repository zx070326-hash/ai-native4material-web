<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><rect width="1280" height="800" fill="#f3f7f3"/><g font-family="Microsoft YaHei,Arial" fill="#213e43"><text x="32" y="48" font-size="30" font-weight="700">两胞 · 三片支持 · 12个主光路保留实体</text><text x="33" y="82" font-size="18">两腔同处25 / 50 °C；驱动外加0 / 4 Vrms。厚度为法向真实值，绘图不按比例。</text><rect x="65" y="125" width="270" height="45" fill="#eadcb4" stroke="#75988b"/><text x="80" y="153.5" font-size="18">Al₂O₃</text><text x="360" y="153.5" font-size="18">入口支持板</text><text x="675" y="153.5" font-size="18" text-anchor="end">8 µm</text><rect x="65" y="170" width="270" height="20" fill="#cec4e3" stroke="#75988b"/><text x="80" y="186.0" font-size="18">ZnO</text><text x="360" y="186.0" font-size="18">内侧驱动电极</text><text x="675" y="186.0" font-size="18" text-anchor="end">99.8 nm</text><rect x="65" y="190" width="270" height="20" fill="#c8dff0" stroke="#75988b"/><text x="80" y="206.0" font-size="18">SiNx</text><text x="360" y="206.0" font-size="18">驱动入口配向/绝缘</text><text x="675" y="206.0" font-size="18" text-anchor="end">20 nm</text><rect x="65" y="210" width="270" height="54" fill="#c3e1d4" stroke="#75988b"/><text x="80" y="243.0" font-size="18">E7</text><text x="360" y="243.0" font-size="18">电控胞：新半波相位厚度</text><text x="675" y="243.0" font-size="18" text-anchor="end">1.44 µm</text><rect x="65" y="264" width="270" height="20" fill="#c8dff0" stroke="#75988b"/><text x="80" y="280.0" font-size="18">SiNx</text><text x="360" y="280.0" font-size="18">驱动出口配向/绝缘</text><text x="675" y="280.0" font-size="18" text-anchor="end">20 nm</text><rect x="65" y="284" width="270" height="20" fill="#cec4e3" stroke="#75988b"/><text x="80" y="300.0" font-size="18">ZnO</text><text x="360" y="300.0" font-size="18">内侧驱动电极</text><text x="675" y="300.0" font-size="18" text-anchor="end">99.8 nm</text><rect x="65" y="304" width="270" height="58" fill="#eadcb4" stroke="#75988b"/><text x="80" y="339.0" font-size="18">Al₂O₃</text><text x="360" y="339.0" font-size="18">同一片共享中板</text><text x="675" y="339.0" font-size="18" text-anchor="end">8 µm</text><rect x="65" y="362" width="270" height="20" fill="#c8dff0" stroke="#75988b"/><text x="80" y="378.0" font-size="18">SiNx</text><text x="360" y="378.0" font-size="18">热胞入口配向</text><text x="675" y="378.0" font-size="18" text-anchor="end">20 nm</text><rect x="65" y="382" width="270" height="74" fill="#c3e1d4" stroke="#75988b"/><text x="80" y="425.0" font-size="18">E7</text><text x="360" y="425.0" font-size="18">温控胞：保留原热相位</text><text x="675" y="425.0" font-size="18" text-anchor="end">8.55 µm</text><rect x="65" y="456" width="270" height="20" fill="#c8dff0" stroke="#75988b"/><text x="80" y="472.0" font-size="18">SiNx</text><text x="360" y="472.0" font-size="18">热胞出口配向</text><text x="675" y="472.0" font-size="18" text-anchor="end">20 nm</text><rect x="65" y="476" width="270" height="45" fill="#eadcb4" stroke="#75988b"/><text x="80" y="504.5" font-size="18">Al₂O₃</text><text x="360" y="504.5" font-size="18">最终出口支持板</text><text x="675" y="504.5" font-size="18" text-anchor="end">8 µm</text><rect x="735" y="122" width="510" height="170" rx="10" fill="white" stroke="#b9cec1"/><text x="757" y="157" font-size="22" font-weight="700">真正减少的是工序和液腔</text><text x="757" y="191" font-size="18">三腔 → 两腔；四片支持 → 三片。</text><text x="757" y="221" font-size="18">六个配向面 → 四个；去掉直接键合接口。</text><text x="757" y="251" font-size="18">无两层增透膜；无新增保留胶 / 种子膜。</text><rect x="735" y="313" width="510" height="162" rx="10" fill="white" stroke="#b9cec1"/><text x="757" y="348" font-size="22" font-weight="700">电极移到液晶腔内侧</text><text x="757" y="383" font-size="18">ZnO / SiNx / 电控E7 / SiNx / ZnO。</text><text x="757" y="414" font-size="18">支撑板不再分走大部分驱动电压。</text><text x="757" y="445" font-size="18">实际液晶端压由Gauss重新求解。</text><rect x="735" y="496" width="510" height="168" rx="10" fill="white" stroke="#b9cec1"/><text x="757" y="532" font-size="22" font-weight="700">两种配向版本分开判断</text><text x="757" y="566" font-size="18">密谱参考：驱动 / 热胞均为八方向。</text><text x="757" y="596" font-size="18">少配向候选：驱动两方向，热胞八方向。</text><text x="757" y="626" font-size="18">候选高阶未闭合；最小带1.5 / 3 µm。</text><path d="M90 665H480" stroke="#247a70" stroke-width="3"/><text x="100" y="697" font-size="18">最终出口后10 mm，25°，5 µm碳筛。</text><rect x="500" y="638" width="10" height="64" fill="#576b6c"/><text x="32" y="744" font-size="18">屏前11实体 + 外置碳筛1实体；计算中的共享板4+4 µm分段是同一片8 µm板。</text><text x="32" y="776" font-size="17">薄板释放、双面配向保护、内侧电极接触、锚定/复谱迁移和实际外围支撑仍是条件；未制样。</text></g></svg>