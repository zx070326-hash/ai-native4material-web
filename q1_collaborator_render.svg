<svg id="q1-design-figure" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="design-title design-desc">
  <title id="design-title">题一共享厚度七层膜堆和实验顺序</title>
  <desc id="design-desc">PEI 入射侧的七层平面膜堆、真实法向厚度标签和从基膜到光学表征的实验顺序。图中块高不是厚度比例。</desc>
  <defs>
    <linearGradient id="design-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfdfc"/><stop offset="1" stop-color="#edf4f2"/></linearGradient>
    <marker id="design-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#397b77"/></marker>
    <style>
      .heading{font:700 23px system-ui,"Microsoft YaHei",sans-serif;fill:#173b3d}
      .subheading{font:13px system-ui,"Microsoft YaHei",sans-serif;fill:#657678}
      .film-name{font:700 15px system-ui,"Microsoft YaHei",sans-serif;fill:#173b3d}
      .film-thickness{font:600 12px ui-monospace,Consolas,monospace;fill:#3d5859}
      .layer-label{font:13px system-ui,"Microsoft YaHei",sans-serif;fill:#305154}
      .layer-no{font-weight:700;fill:#24766f}
      .leader{stroke:#9db8b2;stroke-width:1.1;stroke-dasharray:3 3}
      .callout{font:13px system-ui,"Microsoft YaHei",sans-serif;fill:#3e5c5c}
      .callout-strong{font:700 15px system-ui,"Microsoft YaHei",sans-serif;fill:#173b3d}
      .process-title{font:700 13px system-ui,"Microsoft YaHei",sans-serif;fill:#173b3d}
      .process-note{font:12px system-ui,"Microsoft YaHei",sans-serif;fill:#657678}
      .step-dot{fill:#397b77}
      .step-number{font:700 12px system-ui,"Microsoft YaHei",sans-serif;fill:white}
      .process-arrow{stroke:#397b77;stroke-width:1.8;marker-end:url(#design-arrow)}
      .film-layer{cursor:pointer;transition:filter .15s ease}
      .film-layer:hover,.film-layer:focus{filter:brightness(1.06) drop-shadow(0 4px 4px rgba(33,82,79,.16));outline:none}
    </style>
  </defs>
  <rect width="1100" height="420" rx="18" fill="url(#design-bg)" stroke="#cadbd6"/>
  <text x="38" y="38" class="heading">共享厚度七层：从柔性基膜到光学表征</text>
  <text x="38" y="62" class="subheading">PEI 侧入射；标签给出法向厚度，图形高度仅用于读图</text>
  <text x="50" y="94" class="callout-strong">结构截面</text>
  <line x1="48" y1="112" x2="48" y2="324" stroke="#397b77" stroke-width="2.5" marker-end="url(#design-arrow)"/>
  <text x="25" y="108" class="subheading" transform="rotate(-90 25 108)">入射侧</text>
  <g id="film-stack"><g class="film-layer" data-layer="1" tabindex="0"><polygon points="86,94 110,82 542,82 518,94" fill="#bfe7dc" stroke="#2f8176" stroke-width="1.5"/><polygon points="86,94 518,94 518,162 86,162" fill="#bfe7dc" stroke="#2f8176" stroke-width="1.5"/><polygon points="518,94 542,82 542,150 518,162" fill="#2f8176" opacity=".72" stroke="#2f8176" stroke-width="1.5"/><text x="102" y="133.0" class="film-name">PEI</text><text x="504" y="133.0" text-anchor="end" class="film-thickness">9000 nm</text></g><g class="film-layer" data-layer="2" tabindex="0"><polygon points="86,162 110,150 542,150 518,162" fill="#c6dff2" stroke="#3a759d" stroke-width="1.5"/><polygon points="86,162 518,162 518,187 86,187" fill="#c6dff2" stroke="#3a759d" stroke-width="1.5"/><polygon points="518,162 542,150 542,175 518,187" fill="#3a759d" opacity=".72" stroke="#3a759d" stroke-width="1.5"/><text x="102" y="179.5" class="film-name">TiO₂ 1</text><text x="504" y="179.5" text-anchor="end" class="film-thickness">123 nm</text></g><g class="film-layer" data-layer="3" tabindex="0"><polygon points="86,187 110,175 542,175 518,187" fill="#f0dfb9" stroke="#9a7328" stroke-width="1.5"/><polygon points="86,187 518,187 518,215 86,215" fill="#f0dfb9" stroke="#9a7328" stroke-width="1.5"/><polygon points="518,187 542,175 542,203 518,215" fill="#9a7328" opacity=".72" stroke="#9a7328" stroke-width="1.5"/><text x="102" y="206.0" class="film-name">Al₂O₃ 1</text><text x="504" y="206.0" text-anchor="end" class="film-thickness">178 nm</text></g><g class="film-layer" data-layer="4" tabindex="0"><polygon points="86,215 110,203 542,203 518,215" fill="#c6dff2" stroke="#3a759d" stroke-width="1.5"/><polygon points="86,215 518,215 518,240 86,240" fill="#c6dff2" stroke="#3a759d" stroke-width="1.5"/><polygon points="518,215 542,203 542,228 518,240" fill="#3a759d" opacity=".72" stroke="#3a759d" stroke-width="1.5"/><text x="102" y="232.5" class="film-name">TiO₂ 2</text><text x="504" y="232.5" text-anchor="end" class="film-thickness">123 nm</text></g><g class="film-layer" data-layer="5" tabindex="0"><polygon points="86,240 110,228 542,228 518,240" fill="#f0dfb9" stroke="#9a7328" stroke-width="1.5"/><polygon points="86,240 518,240 518,268 86,268" fill="#f0dfb9" stroke="#9a7328" stroke-width="1.5"/><polygon points="518,240 542,228 542,256 518,268" fill="#9a7328" opacity=".72" stroke="#9a7328" stroke-width="1.5"/><text x="102" y="259.0" class="film-name">Al₂O₃ 2</text><text x="504" y="259.0" text-anchor="end" class="film-thickness">178 nm</text></g><g class="film-layer" data-layer="6" tabindex="0"><polygon points="86,268 110,256 542,256 518,268" fill="#dac9ed" stroke="#76509a" stroke-width="1.5"/><polygon points="86,268 518,268 518,310 86,310" fill="#dac9ed" stroke="#76509a" stroke-width="1.5"/><polygon points="518,268 542,256 542,298 518,310" fill="#76509a" opacity=".72" stroke="#76509a" stroke-width="1.5"/><text x="102" y="294.0" class="film-name">ITO</text><text x="504" y="294.0" text-anchor="end" class="film-thickness">870 nm</text></g><g class="film-layer" data-layer="7" tabindex="0"><polygon points="86,310 110,298 542,298 518,310" fill="#f0dfb9" stroke="#9a7328" stroke-width="1.5"/><polygon points="86,310 518,310 518,329 86,329" fill="#f0dfb9" stroke="#9a7328" stroke-width="1.5"/><polygon points="518,310 542,298 542,317 518,329" fill="#9a7328" opacity=".72" stroke="#9a7328" stroke-width="1.5"/><text x="102" y="324.5" class="film-name">Al₂O₃ 帽层</text><text x="504" y="324.5" text-anchor="end" class="film-thickness">60 nm</text></g></g>
  <line x1="550" y1="128.0" x2="604" y2="128.0" class="leader"/><text x="618" y="133.0" class="layer-label"><tspan class="layer-no">1</tspan> PEI · 9000 nm</text><line x1="550" y1="174.5" x2="604" y2="174.5" class="leader"/><text x="618" y="179.5" class="layer-label"><tspan class="layer-no">2</tspan> TiO₂ 1 · 123 nm</text><line x1="550" y1="201.0" x2="604" y2="201.0" class="leader"/><text x="618" y="206.0" class="layer-label"><tspan class="layer-no">3</tspan> Al₂O₃ 1 · 178 nm</text><line x1="550" y1="227.5" x2="604" y2="227.5" class="leader"/><text x="618" y="232.5" class="layer-label"><tspan class="layer-no">4</tspan> TiO₂ 2 · 123 nm</text><line x1="550" y1="254.0" x2="604" y2="254.0" class="leader"/><text x="618" y="259.0" class="layer-label"><tspan class="layer-no">5</tspan> Al₂O₃ 2 · 178 nm</text><line x1="550" y1="289.0" x2="604" y2="289.0" class="leader"/><text x="618" y="294.0" class="layer-label"><tspan class="layer-no">6</tspan> ITO · 870 nm</text><line x1="550" y1="319.5" x2="604" y2="319.5" class="leader"/><text x="618" y="324.5" class="layer-label"><tspan class="layer-no">7</tspan> Al₂O₃ 帽层 · 60 nm</text>
  <text x="86" y="314" class="callout">层序：PEI → 两对介质反射层 → ITO → Al₂O₃ 帽层</text>
  <rect x="742" y="88" width="316" height="210" rx="14" fill="#ffffff" stroke="#d0dfdb"/>
  <text x="766" y="120" class="callout-strong">实验样品怎么读</text>
  <text x="766" y="148" class="callout">• 首先确认 PEI 朝向和膜厚。</text>
  <text x="766" y="173" class="callout">• ITO 与上一层 Al₂O₃ 接触。</text>
  <text x="766" y="198" class="callout">• 最上方 60 nm Al₂O₃ 作为保护帽层。</text>
  <text x="766" y="223" class="callout">• T/R/A 需要记录入射面、基底和波段。</text>
  <text x="766" y="260" class="subheading">当前是条件候选，仍需同工艺复谱和界面实测。</text>
  <text x="50" y="333" class="callout-strong">建议实验顺序</text>
  <circle cx="78" cy="348" r="12" class="step-dot"/><text x="78" y="352" text-anchor="middle" class="step-number">1</text><text x="100" y="346" class="process-title">PEI 基膜</text><text x="100" y="365" class="process-note">烘干、除气、记录尺寸</text><line x1="196" y1="348" x2="216" y2="348" class="process-arrow"/><circle cx="234" cy="348" r="12" class="step-dot"/><text x="234" y="352" text-anchor="middle" class="step-number">2</text><text x="256" y="346" class="process-title">反射层</text><text x="256" y="365" class="process-note">TiO₂ / Al₂O₃ 两对</text><line x1="352" y1="348" x2="372" y2="348" class="process-arrow"/><circle cx="390" cy="348" r="12" class="step-dot"/><text x="390" y="352" text-anchor="middle" class="step-number">3</text><text x="412" y="346" class="process-title">导电层</text><text x="412" y="365" class="process-note">ITO 870 nm，记录膜温</text><line x1="508" y1="348" x2="528" y2="348" class="process-arrow"/><circle cx="546" cy="348" r="12" class="step-dot"/><text x="546" y="352" text-anchor="middle" class="step-number">4</text><text x="568" y="346" class="process-title">保护与表征</text><text x="568" y="365" class="process-note">Al₂O₃ 帽层，再做 T/R/A</text>
  <text x="50" y="401" class="subheading">这是学术交流用结构图，不是比例工程剖面或制造认证。</text>
</svg>