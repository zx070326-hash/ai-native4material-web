s="layer-small">60 nm</text></g></g>
  <line x1="468" y1="189.0" x2="620" y2="189.0" class="leader"/><text x="632" y="194.0" class="side-label"><tspan class="side-index">1</tspan> PEI · 9000 nm</text><line x1="468" y1="257.0" x2="620" y2="257.0" class="leader"/><text x="632" y="262.0" class="side-label"><tspan class="side-index">2</tspan> TiO₂ H₁ · 123 nm</text><line x1="468" y1="293.0" x2="620" y2="293.0" class="leader"/><text x="632" y="298.0" class="side-label"><tspan class="side-index">3</tspan> Al₂O₃ L₁ · 178 nm</text><line x1="468" y1="329.0" x2="620" y2="329.0" class="leader"/><text x="632" y="334.0" class="side-label"><tspan class="side-index">4</tspan> TiO₂ H₂ · 123 nm</text><line x1="468" y1="365.0" x2="620" y2="365.0" class="leader"/><text x="632" y="370.0" class="side-label"><tspan class="side-index">5</tspan> Al₂O₃ L₂ · 178 nm</text><line x1="468" y1="413.0" x2="620" y2="413.0" class="leader"/><text x="632" y="418.0" class="side-label"><tspan class="side-index">6</tspan> ITO · 870 nm</text><line x1="468" y1="454.0" x2="620" y2="454.0" class="leader"/><text x="632" y="459.0" class="side-label"><tspan class="side-index">7</tspan> Al₂O₃ cap · 60 nm</text>
  <line x1="80" y1="442" x2="480" y2="442" stroke="#216d68" stroke-width="2" marker-end="url(#iso-arrow)"/>
  <text x="80" y="463" class="tiny">光学顺序：PEI → 反射氧化物对 → ITO → 帽层</text>
  <text x="80" y="482" class="tiny">层高为可读性示意；法向厚度以右侧标签为准。</text>

