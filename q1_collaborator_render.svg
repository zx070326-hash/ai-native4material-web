<svg id="q1-isometric" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 610" role="img" aria-labelledby="iso-title iso-desc">
  <title id="iso-title">题一共享厚度七层候选的等距结构渲染</title>
  <desc id="iso-desc">PEI 侧入射的七层膜堆、法向厚度标签、三带指标和条件性加工顺序。层高为展示比例，不是比例工程截面。</desc>
  <defs>
    <linearGradient id="iso-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fcfa"/><stop offset="1" stop-color="#edf5f4"/></linearGradient>
    <marker id="iso-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#216d68"/></marker>
    <style>
      .title{font:700 23px system-ui,"Microsoft YaHei",sans-serif;fill:#18383d}
      .sub{font:13px system-ui,"Microsoft YaHei",sans-serif;fill:#5b6f73}
      .layer-text{font:700 15px system-ui,"Microsoft YaHei",sans-serif;fill:#1f3b40}
      .layer-small{font:600 12px ui-monospace,Consolas,monospace;fill:#38565b}
      .side-label{font:13px system-ui,"Microsoft YaHei",sans-serif;fill:#304d52}
      .side-index{font-weight:700;fill:#216d68}
      .leader{stroke:#9bb8b0;stroke-width:1.2;stroke-dasharray:3 3}
      .metric-label{font:700 14px system-ui,"Microsoft YaHei",sans-serif;fill:#203d42}
      .metric-value{font:700 17px ui-monospace,Consolas,monospace;fill:#203d42}
      .metric-note,.flow-note,.tiny{font:12px system-ui,"Microsoft YaHei",sans-serif;fill:#637579}
      .flow-title{font:700 13px system-ui,"Microsoft YaHei",sans-serif;fill:#203d42}
      .flow-arrow{stroke:#216d68;stroke-width:2;marker-end:url(#iso-arrow)}
    </style>
  </defs>
  <rect width="1080" height="610" rx="18" fill="url(#iso-bg)" stroke="#c4d9d3"/>
  <text x="38" y="40" class="title">共享厚度七层 · PEI 朝天空入射</text>
  <text x="38" y="64" class="sub">等距渲染 + 真实法向厚度标签 · 351/351 有限联合情景 · 最小余量 1.489 pp</text>
  <rect x="814" y="22" width="226" height="32" rx="16" fill="#fff0d9" stroke="#d4a55c"/>
  <text x="927" y="43" text-anchor="middle" class="metric-label" fill="#8d5e22">B 条件候选 · A 未通过</text>

