<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc"><title id="title">全固态三胞光学与物理层序</title><desc id="desc">18个屏前实体和外置碳屏构成19实体；连续氧化层与9.8微米板合为9.883微米光学层。截面不按比例，实际厚度逐层标注。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#24796f"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#abbdb7" stroke-width="1"/></pattern></defs><g font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1600" height="1160" rx="20" fill="#f5f9f7" stroke="#d1dfda" /><text x="38" y="49" font-size="33" fill="#173b3d" font-weight="700" text-anchor="start">题二 · 全固体连接的三液晶胞</text><text x="40" y="84" font-size="20" fill="#52696a" font-weight="400" text-anchor="start">固定同器件四态：25 / 50 °C × 外加 0 / 9.235 Vᵣₘₛ；厚度标签为真实法向尺寸，绘图不按比例</text><rect x="30" y="118" width="990" height="790" rx="15" fill="#fff" stroke="#d2e0db" /><text x="54" y="156" font-size="25" fill="#173b3d" font-weight="700" text-anchor="start">材料截面与连接身份</text><text x="54" y="186" font-size="17" fill="#52696a" font-weight="400" text-anchor="start">光沿 +z 自上向下；外电极指驱动盒的外置端面，接合后上端电极位于复合壁内部</text><rect x="105" y="223" width="338" height="22" rx="0" fill="#eee0bd" stroke="#9b793d" /><text x="119" y="241.0" font-size="19" fill="#173b3d" font-weight="700" text-anchor="start">Al₂O₃</text><line x1="451" y1="234.0" x2="480" y2="234.0" stroke="#a6bab4" stroke-width="1" stroke-dasharray="3 3"/><text x="492" y="241.0" font-size="18" fill="#173b3d" font-weight="400" text-anchor="start">入口氧化层 / AR</text><text x="974" y="241.0" font-size="18" fill="#9b793d" font-weight="700" text-anchor="end">83.03 nm</text><rect x="105" y="245" width="338" height="24" rx="0" fill="#d8cee9" stroke="#75608c" /><text x="119" y="264.0" font-size="19" fill="#173b3d" font-weight="700" text-anchor="start">ZnO</text><line x1="451" y1="257.0" x2="480" y2="257.0" stroke="#a6bab4" stroke-width="1" stroke-dasharray="3 3"/><text x="492" y="264.0" font-size="18" fill="#173b3d" font-weight="400" text-anchor="start">驱动入口电极</text><text x="974" y="264.0" font-size="18" fill="#75608c" font-weight="700" text-anchor="end">99.8 nm</text><rect x="105" y="269" width="338" height="42" rx="0" fill="#eee0bd" stroke="#9b793d" /><text x="119" y="297.0" font-size="19" fill="#173b3d" font-weight="700" text-anchor="start">Al₂O₃</text><line x1="451" y1="290.0" x2="480" y2="290.0" stroke="#a6bab4" stroke-width="1" stroke-dasharray="3 3"/><text x="492" y="297.0" font-size="18" fill="#173b3d" font-weight="400" text-anchor="start">驱动入口板</text><text x="974" y="297.0" font-size="18" fill="#9b793d" font-weight="700" text-anchor="end">8 µm</text><rect x="105" y="311" width="338" height="22" rx="0" fill="#d0e3f0" stroke="#467a9c" /><text x="119" y="329.0" font-size="19" fill="#173b3d" font-weight="700" text-anchor="start">SiNₓ</text><line x1="451" y1="322.0" x2="480" y2="322.0" stroke="#a6bab4" stroke-width="1" stroke-dasharray="3 3"/><text x="492" y="329.0" font-size="18" fill="#173b3d" font-weight="400" text-anchor="start">内配向 / 绝缘</text><text x="974" y="329.0" font-size="18" fill="#467a9c" font-weight="700" text-anchor="end">20 nm</text><rect x="105" y="333" width="338" height="47" rx="0" fill="#cee7df" stroke="#398575" /><text x="119" y="363.5" font-size="19" fill="#173b3d" font-weight="700" text-anchor="start">E7</text><line x1="451" y1="356.5" x2="480" y2="356.5" stroke="#a6bab4" stroke-width="1" stroke-dasharray="3 3"/><text x="492" y="363.5" font-size="18" fill="#173b3d" font-weight="400" text-anchor="start">电控液晶 · P = 12 µm</text><text x="974" y="363.5" font-size="18" fill="#398575" font-weight="700" text-anchor="end">2.5 µm</text><rect x="105" y="380" width="338" height="22" rx="0" fill="#d0e3f0" stroke="#467a9c" /><text x="119" y="398.0" font-size="19" fill="#173b3d" font-weight="700" text-anchor="start">SiNₓ</text><line x1="451" y1="391.0" x2="480" y2="391.0" stroke="#a6bab4" stroke-width="1" stroke-dasharray="3 3"/><text x="492" y="398.0" font-size="18" fill="#173b3d" font-weight="400" text-anchor="start">内配向 / 绝缘</text><text x="974" y="398.0" font-size="18" fill="#467a9c" font-weight="700" text-anchor="end">20 nm</text><rect x="105" y="402" width="338" height="42" rx="0" fill="#eee0bd" stroke="#9b793d" /><text x="119" y="430.0" font-size="19" fill="#173b3d" font-weight="700" text-anchor="start">Al₂O₃</text><line x1="451" y1="423.0" x2="480" y2="423.0" stroke="#a6bab4" stroke-width="1" stroke-dasharray="3 3"/><text x="492" y="430.0" font-size="18" fill="#173b3d" font-weight="400" text-anchor="start">驱动出口板</text><text x="974" y="430.0" font-size="18" fill="#9b793d" font-weight="700" text-anchor="end">8 µm</text><rect x="105" y="444" width="338" height="24" rx="0" fill="#d8cee9" stroke="#75608c" /><text x="119" y="463.0" font-size="19" fill="#173b3d" font-weight="700" text-anchor="start">ZnO</text><line x1="451" y1="456.0" x2="480" y2="456.0" stroke="#a6bab4" stroke-width="1" stroke-dasharray="3 3"/><text x="492" y="463.0" font-size="18" fill="#173b3d" font-weight="400" text-anchor="start">驱动出口电极</text><text x="974" y="463.0" font-size="18" fill="#75608c" font-weight="700" text-anchor="end">99.8 nm</text><rect x="105" y="468" width="338" height="26" rx="0" fill="#eee0bd" stroke="#9b793d" /><text x="119" y="488.0" font-size="19" fill="#173b3d" font-weight="700" text-anchor="start">Al₂O₃</text><line x1="451" y1="481.0" x2="480" y2="481.0" stroke="#a6bab4" stroke-width="1" stroke-dasharray="3 3"/><text x="492" y="488.0" font-size="18" fill="#173b3d" font-weight="400" text-anchor="start">出口氧化接合层</text><text x="974" y="488.0" font-size="18" fill="#9b793d" font-weight="700" text-anchor="end">83.03 nm</text><rect x="105" y="494" width="338" height="56" rx="0" fill="#eee0bd" stroke="#9b793d" /><text x="119" y="529.0" font-size="19" fill="#173b3d" font-weight="700" text-anchor="start">Al₂O₃</text><line x1="451" y1="522.0" x2="480" y2="522.0" stroke="#a6bab4" stroke-width="1" stroke-dasharray="3 3"/><text x="492" y="529.0" font-size="18" fill="#173b3d" font-weight="400" text-anchor="start">被动补偿入口板</text><text x="974" y="529.0" font-size="18" fill="#9b793d" font-weight="700" text-anchor="end">9.8 µm</text><rect x="105" y="550" width="338" height="22" rx="0" fill="#d0e3f0" stroke="#467a9c" /><text x="119" y="568.0" font-size="19" fill="#173b3d" font-weight="700" text-anchor="start">SiNₓ</text><line x1="451" y1="561.0" x2="480" y2="561.0" stroke="#a6bab4" stroke-width="1" stroke-dasharray="3 3"/><text x="492" y="568.0" font-size="18" fill="#173b3d" font-weight="400" text-anchor="start">内配向 / 绝缘</text><text x="974" y="568.0" font-size="18" fill="#467a9c" font-weight="700" text-anchor="end">20 nm</text><rect x="105" y="572" width="338" height="47" rx="0" fill="#cee7df" stroke="#398575" /><text x="119" y="602.5" font-size="19" fill="#173b3d" font-weight="700" text-anchor="start">E7</text><line x1="451" y1="595.5" x2="480" y2="595.5" stroke="#a6bab4" stroke-width="1" stroke-dasharray="3 3"/><text x="492" y="602.5" font-size="18" fill="#173b3d" font-weight="400" text-anchor="start">正交被动补偿 · P = 12 µm</text><text x="974" y="602.5" font-size="18" fill="#398575" font-weight="700" text-anchor="end">2.5 µm</text><rect x="105" y="619" width="338" height="22" rx="0" fill="#d0e3f0" stroke="#467a9c" /><text x="119" y="637.0" font-size="19" fill="#173b3d" font-weight="700" text-anchor="start">SiNₓ</text><line x1="451" y1="630.0" x2="480" y2="630.0" stroke="#a6bab4" stroke-width="1" stroke-dasharray="3 3"/><text x="492" y="637.0" font-size="18" fill="#173b3d" font-weight="400" text-anchor="start">内配向 / 绝缘</text><text x="974" y="637.0" font-size="18" fill="#467a9c" font-weight="700" text-anchor="end">20 nm</text><rect x="105" y="641" width="338" height="42" rx="0" fill="#eee0bd" stroke="#9b793d" /><text x="119" y="669.0" font-size="19" fill="#173b3d" font-weight="700" text-anchor="start">Al₂O₃</text><line x1="451" y1="662.0" x2="480" y2="662.0" stroke="#a6bab4" stroke-width="1" stroke-dasharray="3 3"/><text x="492" y="669.0" font-size="18" fill="#173b3d" font-weight="400" text-anchor="start">补偿 / 热胞共享板</text><text x="974" y="669.0" font-size="18" fill="#9b793d" font-weight="700" text-anchor="end">8 µm</text><rect x="105" y="683" width="338" height="22" rx="0" fill="#d0e3f0" stroke="#467a9c" /><text x="119" y="701.0" font-size="19" fill="#173b3d" font-weight="700" text-anchor="start">SiNₓ</text><line x1="451" y1="694.0" x2="480" y2="694.0" stroke="#a6bab4" stroke-width="1" stroke-dasharray="3 3"/><text x="492" y="701.0" font-size="18" fill="#173b3d" font-weight="400" text-anchor="start">内配向 / 绝缘</text><text x="974" y="701.0" font-size="18" fill="#467a9c" font-weight="700" text-anchor="end">20 nm</text><rect x="105" y="705" width="338" height="60" rx="0" fill="#cee7df" stroke="#398575" /><text x="119" y="742.0" font-size="19" fill="#173b3d" font-weight="700" text-anchor="start">E7</text><line x1="451" y1="735.0" x2="480" y2="735.0" stroke="#a6bab4" stroke-width="1" stroke-dasharray="3 3"/><text x="492" y="742.0" font-size="18" fill="#173b3d" font-weight="400" text-anchor="start">热液晶 · P = 24 µm</text><text x="974" y="742.0" font-size="18" fill="#398575" font-weight="700" text-anchor="end">8.55 µm</text><rect x="105" y="765" width="338" height="22" rx="0" fill="#d0e3f0" stroke="#467a9c" /><text x="119" y="783.0" font-size="19" fill="#173b3d" font-weight="700" text-anchor="start">SiNₓ</text><line x1="451" y1="776.0" x2="480" y2="776.0" stroke="#a6bab4" stroke-width="1" stroke-dasharray="3 3"/><text x="492" y="783.0" font-size="18" fill="#173b3d" font-weight="400" text-anchor="start">内配向 / 绝缘</text><text x="974" y="783.0" font-size="18" fill="#467a9c" font-weight="700" text-anchor="end">20 nm</text><rect x="105" y="787" width="338" height="42" rx="0" fill="#eee0bd" stroke="#9b793d" /><text x="119" y="815.0" font-size="19" fill="#173b3d" font-weight="700" text-anchor="start">Al₂O₃</text><line x1="451" y1="808.0" x2="480" y2="808.0" stroke="#a6bab4" stroke-width="1" stroke-dasharray="3 3"/><text x="492" y="815.0" font-size="18" fill="#173b3d" font-weight="400" text-anchor="start">最终出口板</text><text x="974" y="815.0" font-size="18" fill="#9b793d" font-weight="700" text-anchor="end">8 µm</text><line x1="69" y1="225" x2="69" y2="815" stroke="#24796f" stroke-width="2.2" marker-end="url(#arrow)"/><text x="57" y="207" font-size="18" fill="#24796f" font-weight="700" text-anchor="start">+z</text><rect x="99" y="465" width="350" height="88" rx="0" fill="none" stroke="#24796f" stroke-width="3"/><line x1="105" y1="494" x2="443" y2="494" stroke="#24796f" stroke-width="2" stroke-dasharray="6 4"/><text x="106" y="872" font-size="18" fill="#52696a" font-weight="400" text-anchor="start">接合面虚线：实体边界仍保留；两侧同 n，无内部 air / 胶 / 新种子膜。</text><rect x="1040" y="118" width="530" height="365" rx="15" fill="#fff" stroke="#d2e0db" /><text x="1064" y="156" font-size="25" fill="#173b3d" font-weight="700" text-anchor="start">层数必须分三种口径</text><text x="1065" y="210" font-size="30" fill="#24796f" font-weight="700" text-anchor="start">19 个保留实体</text><text x="1065" y="246" font-size="20" fill="#52696a" font-weight="400" text-anchor="start">屏前 18 个 + 外置碳筛 1 个。</text><text x="1065" y="275" font-size="20" fill="#52696a" font-weight="400" text-anchor="start">五片支持板、三 LC、六 SiNₓ、</text><text x="1065" y="304" font-size="20" fill="#52696a" font-weight="400" text-anchor="start">两 ZnO、两氧化层、碳筛。</text><text x="1065" y="362" font-size="27" fill="#356f98" font-weight="700" text-anchor="start">18 个合并光学材料层</text><text x="1065" y="398" font-size="19" fill="#52696a" font-weight="400" text-anchor="start">83.03 nm 氧化层 + 单 9.8 µm 板</text><text x="1065" y="427" font-size="19" fill="#52696a" font-weight="400" text-anchor="start">连续等效 Al₂O₃ = 9.88303 µm。</text><rect x="1040" y="505" width="530" height="265" rx="15" fill="#fff" stroke="#d2e0db" /><text x="1064" y="543" font-size="25" fill="#173b3d" font-weight="700" text-anchor="start">光学厚度 ≠ 机械包深</text><text x="1065" y="578" font-size="20" fill="#52696a" font-weight="400" text-anchor="start">驱动 Al 8 / ZnO .0998 / 氧化层</text><text x="1065" y="607" font-size="20" fill="#52696a" font-weight="400" text-anchor="start">Al .083028893 / 被动 Al 9.8 µm</text><text x="1065" y="636" font-size="20" fill="#52696a" font-weight="400" text-anchor="start">组成无滑移机械复合壁：</text><text x="1065" y="684" font-size="27" fill="#986b26" font-weight="700" text-anchor="start">总深 17.98283 µm</text><text x="1065" y="724" font-size="18" fill="#52696a" font-weight="400" text-anchor="start">ZnO 隔开两段 Al，不是单个超厚 Al 层。</text><rect x="1040" y="793" width="530" height="215" rx="15" fill="#fff" stroke="#d2e0db" /><text x="1064" y="831" font-size="25" fill="#173b3d" font-weight="700" text-anchor="start">计算切分与总厚</text><text x="1065" y="862" font-size="19" fill="#52696a" font-weight="400" text-anchor="start">未合并：屏前 20 段，含碳筛 21 段。</text><text x="1065" y="891" font-size="19" fill="#52696a" font-weight="400" text-anchor="start">Al 4 + 4 是同一 8 µm 共享板；</text><text x="1065" y="920" font-size="19" fill="#52696a" font-weight="400" text-anchor="start">新增 Al 1.8 是 9.8 µm 板的计算切分。</text><text x="1065" y="969" font-size="20" fill="#24796f" font-weight="700" text-anchor="start">屏前总轴向厚 55.83566 µm</text><rect x="30" y="930" width="990" height="165" rx="15" fill="#fff" stroke="#d2e0db" /><text x="54" y="968" font-size="25" fill="#173b3d" font-weight="700" text-anchor="start">最终出口与环境屏平面</text><line x1="75" y1="1012" x2="370" y2="1012" stroke="#24796f" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="400" y="981" width="12" height="70" rx="0" fill="#536166" stroke="#344348" /><text x="455" y="1007" font-size="23" fill="#173b3d" font-weight="700" text-anchor="start">5 µm 碳筛：外置环境平面，非第六片支持板</text><text x="455" y="1042" font-size="20" fill="#52696a" font-weight="400" text-anchor="start">中心距最终热 Al₂O₃ 出口 10 mm；倾角 25°。</text><text x="38" y="1131" font-size="18" fill="#52696a" font-weight="400" text-anchor="start">所有法向材料层 0.020–9.88303 µm；厚度与整体挠度分列。示意不证明释放、无空隙接合、残余应力或完整制程。</text></g></svg>