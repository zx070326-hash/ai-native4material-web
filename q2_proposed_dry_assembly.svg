<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img" aria-labelledby="title desc"><title id="title">提议的全固态三胞干态装配流程</title><desc id="desc">六个连续工艺环节，先干态制外电极和氧化层，再无新增膜直接接合9.8微米板，完成内SiNx图案及外围液腔后填充，最后装10毫米25度碳屏。流程尚未制造验证。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#24796f"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#abbdb7" stroke-width="1"/></pattern></defs><g font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1600" height="1130" rx="20" fill="#f5f9f7" stroke="#d1dfda" /><text x="38" y="49" font-size="33" fill="#173b3d" font-weight="700" text-anchor="start">题二 · 提议的干态装配顺序</text><text x="40" y="84" font-size="20" fill="#52696a" font-weight="400" text-anchor="start">这是一条可衔接的工艺提案，尚未制样；箭头表示顺序与接口，不表示已完成或已获得制造良率。</text><rect x="30" y="142" width="480" height="355" rx="15" fill="#fff" stroke="#d2e0db" /><text x="54" y="180" font-size="25" fill="#173b3d" font-weight="700" text-anchor="start">先制外部功能面</text><text x="53" y="392" font-size="18" fill="#52696a" font-weight="400" text-anchor="start">驱动 Al8 先留在载体上。</text><text x="53" y="419" font-size="18" fill="#52696a" font-weight="400" text-anchor="start">外表面 ZnO 99.8 nm +</text><text x="53" y="446" font-size="18" fill="#52696a" font-weight="400" text-anchor="start">最终 Al₂O₃ 83.03 nm。</text><rect x="90" y="314" width="350" height="16" rx="0" fill="url(#hatch)" stroke="#9aaea7" /><rect x="90" y="268" width="350" height="46" rx="0" fill="#eee0bd" stroke="#9b793d" /><rect x="90" y="255" width="350" height="13" rx="0" fill="#d8cee9" stroke="#75608c" /><rect x="90" y="241" width="350" height="14" rx="0" fill="#eee0bd" stroke="#9b793d" /><text x="98" y="228" font-size="17" fill="#52696a" font-weight="400" text-anchor="start">外部面 ↑  /  暂留载体 ↓</text><rect x="560" y="142" width="480" height="355" rx="15" fill="#fff" stroke="#d2e0db" /><text x="584" y="180" font-size="25" fill="#173b3d" font-weight="700" text-anchor="start">干态直接氧化物接合</text><text x="583" y="392" font-size="18" fill="#52696a" font-weight="400" text-anchor="start">单9.8 µm被动入口板接合原氧化层。</text><text x="583" y="419" font-size="18" fill="#52696a" font-weight="400" text-anchor="start">连续Al = 9.88303 µm。</text><text x="583" y="446" font-size="18" fill="#52696a" font-weight="400" text-anchor="start">无新胶 / 种子层 / 保留内部air。</text><rect x="620" y="244" width="350" height="38" rx="0" fill="#eee0bd" stroke="#9b793d" /><rect x="620" y="282" width="350" height="12" rx="0" fill="#eee0bd" stroke="#9b793d" /><rect x="620" y="294" width="350" height="12" rx="0" fill="#d8cee9" stroke="#75608c" /><rect x="620" y="306" width="350" height="38" rx="0" fill="#eee0bd" stroke="#9b793d" /><line x1="620" y1="282" x2="970" y2="282" stroke="#24796f" stroke-width="3" stroke-dasharray="6 4"/><text x="630" y="228" font-size="17" fill="#52696a" font-weight="400" text-anchor="start">9.8 µm 板 / 氧化层 / ZnO / Al8</text><rect x="1090" y="142" width="480" height="355" rx="15" fill="#fff" stroke="#d2e0db" /><text x="1114" y="180" font-size="25" fill="#173b3d" font-weight="700" text-anchor="start">加工两侧内液晶面</text><text x="1113" y="392" font-size="18" fill="#52696a" font-weight="400" text-anchor="start">两侧各自制20 nm SiNₓ。</text><text x="1113" y="419" font-size="18" fill="#52696a" font-weight="400" text-anchor="start">8步易轴最小带：1.5 / 3 µm。</text><text x="1113" y="446" font-size="18" fill="#52696a" font-weight="400" text-anchor="start">避免后续工序破坏已完成表面。</text><rect x="1150" y="256" width="350" height="72" rx="0" fill="#eee0bd" stroke="#9b793d" /><rect x="1150" y="244" width="350" height="12" rx="0" fill="#d0e3f0" stroke="#467a9c" /><rect x="1150" y="328" width="350" height="12" rx="0" fill="#d0e3f0" stroke="#467a9c" /><line x1="1165" y1="236" x2="1185" y2="236" stroke="#356f98" stroke-width="3" /><line x1="1165" y1="349" x2="1185" y2="355" stroke="#356f98" stroke-width="3" /><line x1="1207" y1="236" x2="1227" y2="236" stroke="#356f98" stroke-width="3" /><line x1="1207" y1="349" x2="1227" y2="355" stroke="#356f98" stroke-width="3" /><line x1="1249" y1="236" x2="1269" y2="236" stroke="#356f98" stroke-width="3" /><line x1="1249" y1="349" x2="1269" y2="355" stroke="#356f98" stroke-width="3" /><line x1="1291" y1="236" x2="1311" y2="236" stroke="#356f98" stroke-width="3" /><line x1="1291" y1="349" x2="1311" y2="355" stroke="#356f98" stroke-width="3" /><line x1="1333" y1="236" x2="1353" y2="236" stroke="#356f98" stroke-width="3" /><line x1="1333" y1="349" x2="1353" y2="355" stroke="#356f98" stroke-width="3" /><line x1="1375" y1="236" x2="1395" y2="236" stroke="#356f98" stroke-width="3" /><line x1="1375" y1="349" x2="1395" y2="355" stroke="#356f98" stroke-width="3" /><line x1="1417" y1="236" x2="1437" y2="236" stroke="#356f98" stroke-width="3" /><line x1="1417" y1="349" x2="1437" y2="355" stroke="#356f98" stroke-width="3" /><line x1="1459" y1="236" x2="1479" y2="236" stroke="#356f98" stroke-width="3" /><line x1="1459" y1="349" x2="1479" y2="355" stroke="#356f98" stroke-width="3" /><rect x="30" y="555" width="480" height="355" rx="15" fill="#fff" stroke="#d2e0db" /><text x="54" y="593" font-size="25" fill="#173b3d" font-weight="700" text-anchor="start">完成三腔外围组装</text><text x="53" y="805" font-size="18" fill="#52696a" font-weight="400" text-anchor="start">三裸腔高度2.54 / 2.54 / 8.59 µm。</text><text x="53" y="832" font-size="18" fill="#52696a" font-weight="400" text-anchor="start">余下壁与共享Al8构成三个液腔。</text><text x="53" y="859" font-size="18" fill="#52696a" font-weight="400" text-anchor="start">释放、夹持和边界刚度仍待核验。</text><rect x="90" y="645" width="350" height="15" rx="0" fill="#eee0bd" stroke="#9b793d" /><rect x="90" y="675" width="350" height="15" rx="0" fill="#eee0bd" stroke="#9b793d" /><rect x="90" y="705" width="350" height="15" rx="0" fill="#eee0bd" stroke="#9b793d" /><rect x="90" y="735" width="350" height="15" rx="0" fill="#eee0bd" stroke="#9b793d" /><rect x="90" y="660" width="26" height="15" rx="0" fill="#e6e4db" stroke="#986b26" /><rect x="414" y="660" width="26" height="15" rx="0" fill="#e6e4db" stroke="#986b26" /><text x="265" y="673" font-size="15" fill="#52696a" font-weight="400" text-anchor="middle">2.54</text><rect x="90" y="690" width="26" height="15" rx="0" fill="#e6e4db" stroke="#986b26" /><rect x="414" y="690" width="26" height="15" rx="0" fill="#e6e4db" stroke="#986b26" /><text x="265" y="703" font-size="15" fill="#52696a" font-weight="400" text-anchor="middle">2.54</text><rect x="90" y="720" width="26" height="15" rx="0" fill="#e6e4db" stroke="#986b26" /><rect x="414" y="720" width="26" height="15" rx="0" fill="#e6e4db" stroke="#986b26" /><text x="265" y="733" font-size="15" fill="#52696a" font-weight="400" text-anchor="middle">8.59</text><rect x="560" y="555" width="480" height="355" rx="15" fill="#fff" stroke="#d2e0db" /><text x="584" y="593" font-size="25" fill="#173b3d" font-weight="700" text-anchor="start">独立填充与电接触</text><text x="583" y="805" font-size="18" fill="#52696a" font-weight="400" text-anchor="start">三条20 µm支路分别连通环境。</text><text x="583" y="832" font-size="18" fill="#52696a" font-weight="400" text-anchor="start">不将液面气封热压强加给此版本。</text><text x="583" y="859" font-size="18" fill="#52696a" font-weight="400" text-anchor="start">接点不得被无定义的接合面覆盖。</text><path d="M625 660H890V675H960" stroke="#24796f" stroke-width="12" fill="none" /><circle cx="960" cy="675" r="9" fill="white" stroke="#24796f" stroke-width="2"/><path d="M625 695H890V710H960" stroke="#356f98" stroke-width="12" fill="none" /><circle cx="960" cy="710" r="9" fill="white" stroke="#356f98" stroke-width="2"/><path d="M625 730H890V745H960" stroke="#986b26" stroke-width="12" fill="none" /><circle cx="960" cy="745" r="9" fill="white" stroke="#986b26" stroke-width="2"/><rect x="1090" y="555" width="480" height="355" rx="15" fill="#fff" stroke="#d2e0db" /><text x="1114" y="593" font-size="25" fill="#173b3d" font-weight="700" text-anchor="start">装外筛并核对参考</text><text x="1113" y="805" font-size="18" fill="#52696a" font-weight="400" text-anchor="start">最终出口为距离零点。</text><text x="1113" y="832" font-size="18" fill="#52696a" font-weight="400" text-anchor="start">整器件共同25 / 50 °C，</text><text x="1113" y="859" font-size="18" fill="#52696a" font-weight="400" text-anchor="start">同一0 / 9.235 Vᵣₘₛ四态。</text><rect x="1150" y="660" width="10" height="105" rx="0" fill="#eee0bd" stroke="#9b793d" /><line x1="1172" y1="713" x2="1444" y2="713" stroke="#24796f" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="1457" y1="652" x2="1501" y2="766" stroke="#536166" stroke-width="7" /><text x="1233" y="692" font-size="22" fill="#24796f" font-weight="700" text-anchor="start">10 mm / 25°</text><line x1="514" y1="305" x2="551" y2="305" stroke="#24796f" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="1044" y1="305" x2="1081" y2="305" stroke="#24796f" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="514" y1="719" x2="551" y2="719" stroke="#24796f" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="1044" y1="719" x2="1081" y2="719" stroke="#24796f" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M1530 500V526H270V548" stroke="#24796f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="940" width="1540" height="164" rx="13" fill="#fbf0e8" stroke="#dcc1ad" /><text x="55" y="980" font-size="23" fill="#a84b44" font-weight="700" text-anchor="start">必须移除旧模块间支座；接合面应覆盖实际整个重叠面。</text><text x="55" y="1018" font-size="18" fill="#52696a" font-weight="400" text-anchor="start">旧 r180–200 µm 模块支座若保留，会重新撑开间隙。仅在光区做83 nm小凸台会在外围留下空隙，不能称全固体连接。</text><text x="55" y="1046" font-size="18" fill="#52696a" font-weight="400" text-anchor="start">表面平整度、活化后最终厚度 / 光谱、薄板释放、无空洞接合、后续热史 / 图案转移与LC湿润，均不是这张流程图已证明的能力。</text><text x="55" y="1074" font-size="18" fill="#52696a" font-weight="400" text-anchor="start">壁总深17.982829 µm属于机械复合结构；单一连续Al光学块9.88303 µm。最终层账本和真实样品截面须逐项对应。</text></g></svg>