<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc"><title id="title">全固态器件光区流体接点与环境选择屏</title><desc id="desc">局部器件俯视标明150微米光区、210微米配向区、液腔环、三20微米支路及接触提案；分图标明原600孔和10毫米25度屏参考。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#24796f"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#abbdb7" stroke-width="1"/></pattern></defs><g font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1600" height="1120" rx="20" fill="#f5f9f7" stroke="#d1dfda" /><text x="38" y="49" font-size="33" fill="#173b3d" font-weight="700" text-anchor="start">题二 · 光区、流体支路与外置选择屏</text><text x="40" y="84" font-size="20" fill="#52696a" font-weight="400" text-anchor="start">器件平面 x / y 与输出屏投影 x / y 分图；各图比例独立。实线为已定义几何，虚线为尚待工艺细化的提案。</text><rect x="30" y="118" width="730" height="777" rx="15" fill="#fff" stroke="#d2e0db" /><text x="54" y="156" font-size="25" fill="#173b3d" font-weight="700" text-anchor="start">三胞重叠光区：局部俯视</text><text x="54" y="186" font-size="17" fill="#52696a" font-weight="400" text-anchor="start">所有长度 µm；环与分支是保留外围路径，不能从主光路层数中推掉。</text><circle cx="335" cy="410" r="139.4" fill="#e6e4db" stroke="#986b26" stroke-width="2"/><circle cx="335" cy="410" r="122.99999999999999" fill="#fff" stroke="#9b793d" stroke-width="2"/><rect x="248.9" y="323.9" width="172.2" height="172.2" rx="0" fill="#eff5f2" stroke="#24796f" stroke-dasharray="6 4"/><rect x="273.5" y="348.5" width="122.99999999999999" height="122.99999999999999" rx="0" fill="#cfe6dd" stroke="#24796f" /><text x="335" y="417" font-size="20" fill="#24796f" font-weight="700" text-anchor="middle">150 × 150</text><line x1="265" y1="332" x2="275.0" y2="332.0" stroke="#356f98" stroke-width="3" /><line x1="285" y1="332" x2="294.23879532511285" y2="335.82683432365087" stroke="#356f98" stroke-width="3" /><line x1="305" y1="332" x2="312.0710678118655" y2="339.0710678118655" stroke="#356f98" stroke-width="3" /><line x1="325" y1="332" x2="328.82683432365087" y2="341.23879532511285" stroke="#356f98" stroke-width="3" /><line x1="345" y1="332" x2="345.0" y2="342.0" stroke="#356f98" stroke-width="3" /><line x1="365" y1="332" x2="361.17316567634913" y2="341.23879532511285" stroke="#356f98" stroke-width="3" /><line x1="385" y1="332" x2="377.9289321881345" y2="339.0710678118655" stroke="#356f98" stroke-width="3" /><line x1="405" y1="332" x2="395.76120467488715" y2="335.82683432365087" stroke="#356f98" stroke-width="3" /><line x1="165" y1="593" x2="285" y2="593" stroke="#24796f" stroke-width="2.2" marker-end="url(#arrow)"/><text x="73" y="620" font-size="18" fill="#356f98" font-weight="400" text-anchor="start">电 / 补偿沿 x：P12 µm，最小带 1.5 µm</text><line x1="145" y1="480" x2="145" y2="360" stroke="#24796f" stroke-width="2.2" marker-end="url(#arrow)"/><text x="73" y="650" font-size="18" fill="#356f98" font-weight="400" text-anchor="start">热胞沿 y：P24 µm，最小带 3 µm</text><path d="M458 353L574 299L704 299" stroke="#986b26" stroke-width="2" fill="none" /><text x="559" y="282" font-size="18" fill="#986b26" font-weight="400" text-anchor="start">液腔环 r = 150–170</text><path d="M421 324L560 231" stroke="#24796f" stroke-width="2" fill="none" /><text x="416" y="215" font-size="18" fill="#24796f" font-weight="400" text-anchor="start">配向区 x,y = ±105</text><text x="73" y="703" font-size="20" fill="#986b26" font-weight="700" text-anchor="start">环裸高度：2.54 / 2.54 / 8.59 µm</text><text x="73" y="738" font-size="18" fill="#52696a" font-weight="400" text-anchor="start">a = 150 µm：夹固薄板情景。</text><text x="73" y="765" font-size="18" fill="#52696a" font-weight="400" text-anchor="start">基片外缘与接合重叠面尚未定尺寸。</text><path d="M462.1 426.4H500.0V656.0H540.0" stroke="#24796f" stroke-width="16.4" fill="none" stroke-linejoin="round" opacity=".55"/><circle cx="540.0" cy="656.0" r="8.2" fill="white" stroke="#24796f" stroke-width="2"/><text x="556.0" y="661.0" font-size="16" fill="#24796f" font-weight="400" text-anchor="start">(250, 300)</text><path d="M462.1 446.9H500.0V738.0H540.0" stroke="#356f98" stroke-width="16.4" fill="none" stroke-linejoin="round" opacity=".55"/><circle cx="540.0" cy="738.0" r="8.2" fill="white" stroke="#356f98" stroke-width="2"/><text x="556.0" y="743.0" font-size="16" fill="#356f98" font-weight="400" text-anchor="start">(250, 400)</text><path d="M462.1 467.4H500.0V820.0H540.0" stroke="#986b26" stroke-width="16.4" fill="none" stroke-linejoin="round" opacity=".55"/><circle cx="540.0" cy="820.0" r="8.2" fill="white" stroke="#986b26" stroke-width="2"/><text x="556.0" y="825.0" font-size="16" fill="#986b26" font-weight="400" text-anchor="start">(250, 500)</text><text x="452" y="620" font-size="18" fill="#52696a" font-weight="400" text-anchor="start">三条独立 z 层支路</text><text x="452" y="647" font-size="17" fill="#52696a" font-weight="400" text-anchor="start">宽 20；路线为提案</text><rect x="80" y="307" width="73" height="54" rx="5" fill="#eee7f5" stroke="#75608c" stroke-dasharray="5 4"/><text x="116" y="340" font-size="17" fill="#75608c" font-weight="700" text-anchor="middle">ZnO</text><path d="M153 335L205 360" stroke="#75608c" stroke-width="2" fill="none" /><text x="71" y="281" font-size="18" fill="#75608c" font-weight="400" text-anchor="start">接触 tab 在接合区外 / 显式缺口</text><text x="65" y="840" font-size="18" fill="#a84b44" font-weight="400" text-anchor="start">移除旧模块 r180–200 环形支座；本图不将其计作保留垫片。</text><rect x="790" y="118" width="780" height="497" rx="15" fill="#fff" stroke="#d2e0db" /><text x="814" y="156" font-size="25" fill="#173b3d" font-weight="700" text-anchor="start">原 600 选择屏：前向投影坐标</text><text x="814" y="186" font-size="17" fill="#52696a" font-weight="400" text-anchor="start">筛材料为碳 5 µm；旧核文件的 Ni 名称不代表当前筛材料。孔为三条固定槽。</text><rect x="820.0" y="242.0" width="720.0" height="216.0" rx="0" fill="#5b696d" stroke="#344348" /><rect x="880.0" y="278.0" width="228.0" height="144.0" rx="0" fill="#f5f9f7" stroke="#d8e5df" /><rect x="1156.0" y="278.0" width="48.0" height="144.0" rx="0" fill="#f5f9f7" stroke="#d8e5df" /><rect x="1252.0" y="278.0" width="228.0" height="144.0" rx="0" fill="#f5f9f7" stroke="#d8e5df" /><line x1="1180" y1="224" x2="1180" y2="476" stroke="#b2c8c0" stroke-width="1" stroke-dasharray="5 4"/><line x1="855" y1="350" x2="1505" y2="350" stroke="#b2c8c0" stroke-width="1" stroke-dasharray="5 4"/><text x="1180" y="357" font-size="16" fill="#24796f" font-weight="700" text-anchor="middle">400</text><text x="830" y="230" font-size="19" fill="#173b3d" font-weight="700" text-anchor="start">x: [−2500,−600] ∪ [−200,200] ∪ [600,2500]</text><text x="830" y="516" font-size="20" fill="#24796f" font-weight="700" text-anchor="start">名义 y = ±600；每条边保守内收 11 µm。</text><text x="830" y="550" font-size="18" fill="#52696a" font-weight="400" text-anchor="start">积分域：x [−2489,−611] / [−189,189] / [611,2489]；y ±589。</text><text x="830" y="576" font-size="18" fill="#52696a" font-weight="400" text-anchor="start">整屏投影外缘 20 × 15 mm，未在局部孔图中按同一比例绘出。</text><rect x="790" y="639" width="780" height="256" rx="15" fill="#fff" stroke="#d2e0db" /><text x="814" y="677" font-size="25" fill="#173b3d" font-weight="700" text-anchor="start">最终出口到屏：y–z 侧视</text><text x="814" y="707" font-size="17" fill="#52696a" font-weight="400" text-anchor="start">10 mm 沿 z 定义，倾斜参考为 z = 10000 + y tan 25°（µm）。</text><line x1="850" y1="813" x2="1490" y2="813" stroke="#abc0b7" stroke-width="1" stroke-dasharray="5 4"/><rect x="890" y="730" width="13" height="120" rx="0" fill="#eee0bd" stroke="#9b793d" /><line x1="916" y1="813" x2="1367" y2="813" stroke="#24796f" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="1372" y1="725" x2="1447" y2="882" stroke="#536166" stroke-width="8" /><text x="921" y="776" font-size="22" fill="#24796f" font-weight="700" text-anchor="start">z₀ = 10 mm</text><text x="842" y="875" font-size="18" fill="#52696a" font-weight="400" text-anchor="start">最终热胞 Al8 出口</text><text x="1439" y="745" font-size="22" fill="#173b3d" font-weight="700" text-anchor="start">25°</text><text x="1451" y="872" font-size="18" fill="#52696a" font-weight="400" text-anchor="start">碳屏</text><rect x="30" y="921" width="1540" height="169" rx="15" fill="#fff" stroke="#d2e0db" /><text x="54" y="959" font-size="25" fill="#173b3d" font-weight="700" text-anchor="start">套准与边界的正确读法</text><text x="58" y="990" font-size="19" fill="#52696a" font-weight="400" text-anchor="start">电控 / 被动补偿共享 P12 易轴纹理；补偿横向套准 6 µm，对应 π/2 轴相位，不是另加旋转后的第二次位移。</text><text x="58" y="1019" font-size="19" fill="#52696a" font-weight="400" text-anchor="start">热胞相对驱动纹理在空间与轴向同时转 90°。硬截断 Gaussian 的 waist = 75 µm，完整 Gaussian 入射功率作分母。</text><text x="58" y="1048" font-size="19" fill="#52696a" font-weight="400" text-anchor="start">接触 tab 形状、支路曲折路线、基片外形 / 重叠边界仍是工艺提案；当前投影是周期求场后施加有限出口包络，非全器件有限边界 Maxwell。</text></g></svg>